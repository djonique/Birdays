apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localPropertiesFile = rootProject.file("local.properties")
ext.localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { ext.localProperties.load(it) }
}

// A release build is only signed when every required entry is present AND the keystore file
// itself exists. Checking the file avoids the "signingConfig is configured but the path is
// wrong" case, which used to surface as an unsigned release APK at the end of the build.
def releaseStoreFile = keystoreProperties.containsKey('storeFile')
        ? file(keystoreProperties['storeFile'])
        : null
def hasReleaseSigning = releaseStoreFile != null
        && releaseStoreFile.exists()
        && keystoreProperties.containsKey('storePassword')
        && keystoreProperties.containsKey('keyAlias')
        && keystoreProperties.containsKey('keyPassword')

def getProp(Properties props, String key, String defaultValue) {
    return props.containsKey(key) ? props[key] : defaultValue
}

def getAdUnitId(Properties props, String key, String defaultValue) {
    // Ad unit ids belong to the developer's local setup, not to the signing config. Prefer
    // local.properties (already git-ignored) and keep keystore.properties as a fallback so
    // existing checkouts keep working.
    def value = localProperties.containsKey(key)
            ? localProperties[key]
            : (props.containsKey(key) ? props[key] : defaultValue)
    return value.replace('"', '')
}

// The check below is only meaningful when a release variant is actually requested. Gradle always
// configures every build type, so failing unconditionally would break debug builds and IDE sync.
def releaseVariantRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

/**
 * Fails the build unless a real (non-demo) ad unit id is configured. Demo ids must never reach
 * a release build: the app would silently serve test ads to production users.
 *
 * <p>Declared as a closure (not a script method) so it captures the local `keystoreProperties`
 * loaded above.</p>
 */
def requireReleaseAdId = { String key ->
    def rawValue = localProperties.containsKey(key)
            ? localProperties[key]
            : (keystoreProperties.containsKey(key) ? keystoreProperties[key] : null)
    def value = rawValue == null ? '' : rawValue.toString().replace('"', '').trim()
    if (value.isEmpty() || value.startsWith('demo-')) {
        throw new GradleException("Birdays: release ad unit id '" + key + "' is missing or still "
                + "a demo id. Set it in local.properties (or keystore.properties) before "
                + "building a release.")
    }
    return value
}

android {
    namespace = 'com.djonique.birdays'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.djonique.birdays"
        minSdk = 26
        targetSdk = 36
        versionCode 19
        versionName "2.0.0"
        vectorDrawables.useSupportLibrary = true
        resValue "string", "version_name", versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            buildConfigField "String", "REWARDED_AD_UNIT_ID", "\"${getAdUnitId(keystoreProperties, 'YandexRewardedAdUnitIdDebug', 'demo-rewarded-yandex')}\""
            buildConfigField "String", "NATIVE_AD_UNIT_ID", "\"${getAdUnitId(keystoreProperties, 'YandexNativeAdUnitIdDebug', 'demo-native-content-yandex')}\""
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (releaseVariantRequested
                    && !project.hasProperty('birdaysAllowUnsignedRelease')) {
                throw new GradleException("Birdays: release signing is not configured "
                        + "(keystore.properties is missing storeFile/storePassword/keyAlias/"
                        + "keyPassword or the keystore file does not exist). Pass "
                        + "-PbirdaysAllowUnsignedRelease to build an unsigned release on purpose.")
            } else {
                logger.warn("Birdays: release signing is not configured (keystore.properties is " +
                        "missing storeFile/storePassword/keyAlias/keyPassword or the keystore " +
                        "file does not exist). The release APK will be UNSIGNED.")
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }

            // Release builds require real ad unit ids; debug keeps the demo fallback above.
            def rewardedAdId = releaseVariantRequested
                    ? requireReleaseAdId('YandexRewardedAdUnitIdRelease')
                    : getAdUnitId(keystoreProperties, 'YandexRewardedAdUnitIdRelease', 'demo-rewarded-yandex')
            def nativeAdId = releaseVariantRequested
                    ? requireReleaseAdId('YandexNativeAdUnitIdRelease')
                    : getAdUnitId(keystoreProperties, 'YandexNativeAdUnitIdRelease', 'demo-native-content-yandex')

            buildConfigField "String", "REWARDED_AD_UNIT_ID", "\"${rewardedAdId}\""
            buildConfigField "String", "NATIVE_AD_UNIT_ID", "\"${nativeAdId}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'

    // Ads
    implementation 'com.yandex.android:mobileads:8.6.0'

    // Google Sign-In & Drive API & Play Review
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.api-client:google-api-client-android:2.6.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20240521-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Local unit tests (JVM)
    testImplementation 'junit:junit:4.13.2'
    // Context is mocked in Utils.daysLeft tests; no real Android calls are made on the JVM.
    testImplementation 'org.mockito:mockito-core:5.14.2'

    // Instrumented tests (run on a device/emulator)
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

apply plugin: 'com.google.gms.google-services'
