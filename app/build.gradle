apply plugin: 'com.android.application'
//apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'com.google.firebase.crashlytics'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def getProp(Properties props, String key, String defaultValue) {
    return props.containsKey(key) ? props[key] : defaultValue
}

android {
    namespace 'com.djonique.birdays'
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.djonique.birdays"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 19
        versionName "1.6.0"
        vectorDrawables.useSupportLibrary = true
        resValue "string", "version_name", versionName
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            minifyEnabled false
            def adId = getProp(keystoreProperties, 'InterstitialAdIdDebug', 'ca-app-pub-3940256099942544/1033173712').replace('"', '')
            resValue "string", "banner_ad_id", getProp(keystoreProperties, 'BannerAdIdDebug', "ca-app-pub-3940256099942544/6300978111")
            buildConfigField "String", "INTERSTITIAL_AD_ID", "\"${adId}\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def adId = getProp(keystoreProperties, 'InterstitialAdIdRelease', 'ca-app-pub-3940256099942544/1033173712').replace('"', '')
            resValue "string", "banner_ad_id", getProp(keystoreProperties, 'BannerAdIdRelease', "ca-app-pub-3940256099942544/6300978111")
            buildConfigField "String", "INTERSTITIAL_AD_ID", "\"${adId}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'

    // Google Play Services Ads & Firebase
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'

    testImplementation 'junit:junit:4.13.2'
}

apply plugin: 'com.google.gms.google-services'