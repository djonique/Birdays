apply plugin: 'com.android.application'
//apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'com.google.firebase.crashlytics'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def getProp(Properties props, String key, String defaultValue) {
    return props.containsKey(key) ? props[key] : defaultValue
}

def getAdUnitId(Properties props, String key, String defaultValue) {
    return getProp(props, key, defaultValue).replace('"', '')
}

android {
    namespace = 'com.djonique.birdays'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.djonique.birdays"
        minSdk = 24
        targetSdk = 36
        versionCode 19
        versionName "1.6.0"
        vectorDrawables.useSupportLibrary = true
        resValue "string", "version_name", versionName
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            minifyEnabled = false
            buildConfigField "String", "BANNER_AD_UNIT_ID", "\"${getAdUnitId(keystoreProperties, 'YandexBannerAdUnitIdDebug', 'demo-banner-yandex')}\""
            buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", "\"${getAdUnitId(keystoreProperties, 'YandexInterstitialAdUnitIdDebug', 'demo-interstitial-yandex')}\""
            buildConfigField "String", "REWARDED_AD_UNIT_ID", "\"${getAdUnitId(keystoreProperties, 'YandexRewardedAdUnitIdDebug', 'demo-rewarded-yandex')}\""
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BANNER_AD_UNIT_ID", "\"${getAdUnitId(keystoreProperties, 'YandexBannerAdUnitIdRelease', 'demo-banner-yandex')}\""
            buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", "\"${getAdUnitId(keystoreProperties, 'YandexInterstitialAdUnitIdRelease', 'demo-interstitial-yandex')}\""
            buildConfigField "String", "REWARDED_AD_UNIT_ID", "\"${getAdUnitId(keystoreProperties, 'YandexRewardedAdUnitIdRelease', 'demo-rewarded-yandex')}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'

    // Ads
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.yandex.android:mobileads:8.6.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'

    testImplementation 'junit:junit:4.13.2'
}

apply plugin: 'com.google.gms.google-services'