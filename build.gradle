buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Yandex Mobile Ads artifacts (documented setup). mobileads itself is also on Maven
        // Central, but mediation and future artifacts live in this repository only.
        maven {
            url = uri("https://ads.maven.yandex.net/")
            content {
                includeGroup("com.yandex.android")
                includeGroupAndSubgroups("com.yandex.ads")
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
